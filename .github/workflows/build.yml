name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Python dependencies
        run: pip install -r requirements.txt
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Unit tests
        run: python tests/test_safety.py
      - name: GUI smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python tests/gui_smoke.py
      - name: GUI smoke test (Windows)
        if: runner.os == 'Windows'
        run: python tests/gui_smoke.py

  build:
    name: Build (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: windows-latest
            label: windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System dependencies
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ffmpeg espeak-ng
              ;;
          esac

      - name: Bundle espeak-ng with the app (best effort)
        shell: bash
        run: |
          mkdir -p bundle/bin
          case "$RUNNER_OS" in
            Linux)
              if command -v espeak-ng >/dev/null 2>&1; then
                cp "$(command -v espeak-ng)" bundle/bin/ || true
                ldd "$(command -v espeak-ng)" 2>/dev/null | awk '/=>/{print $3}' | xargs -r -I{} cp -n {} bundle/bin/ 2>/dev/null || true
                cp -rn /usr/lib/*/espeak-ng-data /usr/share/espeak-ng-data bundle/bin/ 2>/dev/null || true
              fi
              ;;
            Windows)
              curl -fsSL -o espeak-ng.msi https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi
              echo "7f673c709ea5dd579d3b5ebb98688cc575328a6ab7438d2bc405b88cedaeafb9  espeak-ng.msi" | sha256sum -c -
              msiexec //a espeak-ng.msi //qn TARGETDIR="$PWD/espeak" >/dev/null 2>&1 || true
              if [ -d espeak ]; then
                find espeak -iname "espeak-ng.exe" -exec cp -f {} bundle/bin/ \; 2>/dev/null || true
                find espeak -iname "*.dll" -exec cp -n {} bundle/bin/ \; 2>/dev/null || true
                find espeak -type d -iname "espeak-ng-data" -exec cp -rn {} bundle/bin/ \; 2>/dev/null || true
              fi
              ;;
          esac
          ls -la bundle/bin || true

      - name: Dependencies and PyInstaller
        shell: bash
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Build executable
        shell: bash
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          ARGS=(pyinstaller --noconfirm --clean --onefile --windowed --name multivoice)
          ARGS+=(--collect-all edge_tts --collect-all gtts --collect-all imageio_ffmpeg --collect-all customtkinter)
          # Themes from the estilo-* skills, read at runtime via sys._MEIPASS
          ARGS+=(--add-data "assets/temas${SEP}assets/temas")
          case "$RUNNER_OS" in
            Windows) ARGS+=(--icon assets/icon.ico --version-file packaging/version_info.txt --hidden-import sounddevice --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32) ;;
          esac
          if [ -d bundle/bin ]; then
            ARGS+=(--add-data "bundle/bin${SEP}bin")
          fi
          "${ARGS[@]}" multivoice.py
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multivoice-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package per OS
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            zip -r "../${name}.zip" "$d"
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip \
              --title "MultiVoice $GITHUB_REF_NAME" \
              --generate-notes
          fi