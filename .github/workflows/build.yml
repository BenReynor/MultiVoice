name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Dependencias Python
        run: pip install -r requirements.txt
      - name: Prueba de humo
        run: python tests/smoke_test.py

  build:
    name: Build (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-intel
            python_arch: x64
          - os: macos-latest
            label: macos-arm64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          architecture: ${{ matrix.python_arch }}

      - name: Dependencias de sistema
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ffmpeg espeak-ng
              ;;
            macOS)
              brew install espeak-ng || true
              ;;
          esac

      - name: Empacar espeak-ng con la app (best effort)
        shell: bash
        env:
          PY_ARCH: ${{ matrix.python_arch }}
        run: |
          mkdir -p bundle/bin
          case "$RUNNER_OS" in
            Linux)
              if command -v espeak-ng >/dev/null 2>&1; then
                cp "$(command -v espeak-ng)" bundle/bin/ || true
                ldd "$(command -v espeak-ng)" 2>/dev/null | awk '/=>/{print $3}' | xargs -r -I{} cp -n {} bundle/bin/ 2>/dev/null || true
                cp -rn /usr/lib/*/espeak-ng-data /usr/share/espeak-ng-data bundle/bin/ 2>/dev/null || true
              fi
              ;;
            macOS)
              if [ "$PY_ARCH" = "x64" ]; then
                echo "Saltamos espeak en el build Intel (brew instala arm64)"
              else
                ES="$(brew --prefix espeak-ng 2>/dev/null)/bin/espeak-ng"
                if [ -x "$ES" ]; then
                  cp "$ES" bundle/bin/
                  for lib in $(otool -L "$ES" | tail -n +2 | awk '{print $1}'); do
                    case "$lib" in
                      /opt/homebrew/lib/*|/usr/local/lib/*) cp -n "$lib" bundle/bin/ 2>/dev/null || true ;;
                    esac
                  done
                  cp -rn "$(brew --prefix espeak-ng)/share/espeak-ng-data" bundle/bin/ 2>/dev/null || true
                fi
              fi
              ;;
            Windows)
              curl -fsSL -o espeak-ng.msi https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi
              msiexec //a espeak-ng.msi //qn TARGETDIR="$PWD/espeak" >/dev/null 2>&1 || true
              if [ -d espeak ]; then
                find espeak -iname "espeak-ng.exe" -exec cp -f {} bundle/bin/ \; 2>/dev/null || true
                find espeak -iname "*.dll" -exec cp -n {} bundle/bin/ \; 2>/dev/null || true
                find espeak -type d -iname "espeak-ng-data" -exec cp -rn {} bundle/bin/ \; 2>/dev/null || true
              fi
              ;;
          esac
          ls -la bundle/bin || true

      - name: Dependencias y PyInstaller
        shell: bash
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Crear icono .icns (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p icon.iconset
          for p in "16 icon_16x16" "32 icon_16x16@2x" "32 icon_32x32" "64 icon_32x32@2x" \
                   "128 icon_128x128" "256 icon_128x128@2x" "256 icon_256x256" \
                   "512 icon_256x256@2x" "512 icon_512x512" "1024 icon_512x512@2x"; do
            set -- $p
            sips -z $1 $1 assets/icon.png --out "icon.iconset/$2.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o assets/icon.icns
          ls -la assets/icon.icns

      - name: Compilar ejecutable
        shell: bash
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          ARGS=(pyinstaller --noconfirm --clean --onefile --windowed --name tts-multitud)
          ARGS+=(--collect-all edge_tts --collect-all gtts --collect-all imageio_ffmpeg)
          case "$RUNNER_OS" in
            Windows) ARGS+=(--icon assets/icon.ico --version-file packaging/version_info.txt --hidden-import sounddevice) ;;
            macOS)   ARGS+=(--icon assets/icon.icns --osx-bundle-identifier com.benreynor.ttsmultitud --hidden-import sounddevice) ;;
          esac
          if [ -d bundle/bin ]; then
            ARGS+=(--add-data "bundle/bin${SEP}bin")
          fi
          "${ARGS[@]}" tts_multitud.py
          ls -la dist

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tts-multitud-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Empaquetar por SO
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            zip -r "../${name}.zip" "$d"
          done
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip \
              --title "TTS Multitud $GITHUB_REF_NAME" \
              --generate-notes
          fi